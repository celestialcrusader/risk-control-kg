# Temporal Dynamic Configuration for Development
# Overrides for local development environment

system.forceSearchAttributesCacheInvalidationInterval:
  - value: 300s
    constraints: {}

system.datastoreClusterFailoverWeight:
  - value: 0
    constraints: {}

history.maxTransactionSize:
  - value: 1048576
    constraints:
      min: 1048576
      max: 10485760

# Namespace-specific settings
rckg-production:
  # Workflow settings
  historyExecutionStartToCloseTimeoutSeconds: 1209600 # 14 days max
  workflowExecutionStartToCloseTimeoutSeconds: 1209600

  # Activity settings
  defaultActivityRetryInitialIntervalSeconds: 1
  defaultActivityRetryMaximumIntervalSeconds: 300
  defaultActivityRetryMaximumAttempts: 3

  # Throttling settings
  getHistoryThrottleRPS: 1000
  readTHPS: 1000

  # Visibility settings
  enableReadFromClosedExecutionInReadOnlyMode: true

# Global throttling
frontend.throttleRPS:
  - value: 5000
    constraints: {}

# Hot shard throttling
history.throttleRPS:
  - value: 1000
    constraints: {}

# Decision task throttling
matching.throttleRPS:
  - value: 2000
    constraints: {}

# Log settings for development
log.level: debug

# Health settings
health.checkFailureExpirationSeconds:
  - value: 60
    constraints: {}
