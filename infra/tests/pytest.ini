# pytest configuration for RCKG Platform

[pytest]
testpaths = infra/tests backend/tests
pythonpath = backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marker definitions
markers =
    integration: marks tests as integration tests (requires external services)
    unit: marks tests as unit tests (isolated, no external dependencies)
    slow: marks tests as slow running (> 10 seconds)

# Output settings
addopts = -v --tb=short --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout settings
timeout = 300

# Coverage settings
coverage_context =
    branches
    omit =
        */tests/*
        */__init__.py
        */migrations/*
