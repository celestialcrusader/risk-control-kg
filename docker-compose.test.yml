version: '3.8'

services:
  postgres_test:
    image: postgres:16-alpine
    container_name: rckg_postgres_test
    environment:
      POSTGRES_DB: rckg_test
      POSTGRES_USER: rckg_user
      POSTGRES_PASSWORD: rckg_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rckg_user -d rckg_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  memgraph_test:
    image: memgraph/memgraph-platform:latest
    container_name: rckg_memgraph_test
    ports:
      - "7688:7687"
    environment:
      MEMGRAPH_USER: ""
      MEMGRAPH_PASSWORD: ""

  elasticsearch_test:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: rckg_elasticsearch_test
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9201:9200"

  qdrant_test:
    image: qdrant/qdrant:latest
    container_name: rckg_qdrant_test
    ports:
      - "6334:6333"
