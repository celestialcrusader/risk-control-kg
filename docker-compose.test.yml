version: '3.8'

services:
  postgres_test:
    image: postgres:16-alpine
    container_name: rckg_postgres_test
    environment:
      POSTGRES_DB: rckg_test
      POSTGRES_USER: rckg_user
      POSTGRES_PASSWORD: rckg_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rckg_user -d rckg_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  memgraph_test:
    image: memgraph/memgraph-platform:latest
    container_name: rckg_memgraph_test
    ports:
      - "7687:7687"
      - "7688:7687"
      - "3000:3000"
      - "7444:7444"



  elasticsearch_test:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: rckg_elasticsearch_test
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9201:9200"

  qdrant_test:
    image: qdrant/qdrant:latest
    container_name: rckg_qdrant_test
    ports:
      - "6334:6333"

  minio_test:
    image: minio/minio:latest
    container_name: rckg_minio_test
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rckg_admin
      MINIO_ROOT_PASSWORD: rckg_secret_password
    ports:
      - "9000:9000"
      - "9001:9001"

