# RCKG Platform Docker Compose Configuration
# Infrastructure services for development environment
#
# This file defines the complete infrastructure stack:
# - PostgreSQL 16 (Cold store + Temporal backend)
# - Memgraph (Hot graph database)
# - Qdrant (Vector database for embeddings)
# - MinIO (S3-compatible object storage)
# - Redis (Cache layer)
# - Temporal (Workflow orchestration)
# - Langfuse (Observability)
# - Kafka + Zookeeper (Event bus)
#
# MEMORY REQUIREMENTS:
# - Minimum: 128GB RAM (recommended for full stack)
# - PostgreSQL: 64GB
# - Memgraph: 32GB
# - Qdrant: 16GB
# - Redis: 8GB
# - Other services: ~4GB combined
#
# For systems with less memory, reduce mem_limit values accordingly.

version: '3.8'

services:
  # ============================================
  # PostgreSQL 16 - Cold Store & Temporal Backend
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: rckg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rckg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rckg_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-rckg_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rckg} -d ${POSTGRES_DB:-rckg_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rckg-net
    mem_limit: 64gb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ============================================
  # Memgraph - Hot Graph Database
  # ============================================
  memgraph:
    image: memgraph/memgraph:latest
    container_name: rckg-memgraph
    restart: unless-stopped
    environment:
      MG_USERNAME: ${MEMGRAPH_USERNAME:-rckg}
      MG_PASSWORD: ${MEMGRAPH_PASSWORD:-rckg_secret_password}
      MG_PORT: ${MEMGRAPH_PORT:-7687}
      MG_WEB_INTERFACE_PORT: ${MEMGRAPH_WEB_PORT:-7688}
    ports:
      - "${MEMGRAPH_PORT:-7687}:7687"
      - "${MEMGRAPH_WEB_PORT:-7688}:7688"
    volumes:
      - memgraph_data:/opt/memgraph/storage
    healthcheck:
      test: ["CMD", "/usr/lib/memgraph/memgraph", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - rckg-net
    mem_limit: 32gb

  # ============================================
  # Qdrant - Vector Database
  # ============================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rckg-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "./qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - rckg-net
    deploy:
      resources:
        limits:
          memory: 16G

  # ============================================
  # MinIO - S3-Compatible Object Storage
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: rckg-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rckg_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rckg_secret_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rckg-net

  # MinIO Startup Script - Creates buckets on first run
  minio-init:
    image: minio/mc:latest
    container_name: rckg-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc config host add rckg http://minio:9000 ${MINIO_ROOT_USER:-rckg_admin} ${MINIO_ROOT_PASSWORD:-rckg_secret_password}; do
        echo 'Waiting for MinIO...' && sleep 2;
      done;
      mc mb rckg/source-regulations --ignore-existing;
      mc mb rckg/minio-data --ignore-existing;
      mc mb rckg/markdown-conversions --ignore-existing;
      mc mb rckg/evidence-artifacts --ignore-existing;
      echo 'MinIO buckets initialized';
      "
    networks:
      - rckg-net

  # ============================================
  # Redis - Cache Layer
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: rckg-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-rckg_secret_password} --maxmemory 8gb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rckg_secret_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rckg-net

  # ============================================
  # Temporal - Workflow Orchestration
  # ============================================
  temporal:
    image: temporalio/auto-setup:latest
    container_name: rckg-temporal
    restart: unless-stopped
    environment:
      TEMPORAL_CLI_ADDRESS: :7233
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-rckg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rckg_secret_password}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development.yaml
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
      - "${TEMPORAL_WEB_PORT:-8233}:8233"
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rckg-net

  # ============================================
  # Langfuse - Observability Platform
  # ============================================
  langfuse:
    image: langfuse/langfuse:2
    container_name: rckg-langfuse
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rckg}:${POSTGRES_PASSWORD:-rckg_secret_password}@postgres:5432/${POSTGRES_DB:-rckg_db}
      SALT: ${LANGFUSE_SALT:-rckg_secret_salt}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-rckg_nextauth_secret}
      NEXTAUTH_URL: http://localhost:3000
      PostgreSQL_HOST: postgres
      PostgreSQL_PORT: 5432
      PostgreSQL_USER: ${POSTGRES_USER:-rckg}
      PostgreSQL_PASSWORD: ${POSTGRES_PASSWORD:-rckg_secret_password}
      PostgreSQL_DATABASE: ${POSTGRES_DB:-rckg_db}
      OPENAI_API_KEY: ${LANGFUSE_OPENAI_API_KEY:-}
      TELEMETRY_ENABLED: "false"
    ports:
      - "${LANGFUSE_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rckg-net


  # ============================================
  # Zookeeper - Kafka Coordination
  # ============================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: rckg-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT:-2181}
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rckg-net

  # ============================================
  # Apache Kafka - Event Bus
  # ============================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: rckg-kafka
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_COMMIT_INTERVAL_MS: 1000
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "29092:29092"
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - rckg-net


# ============================================
# Named Volumes for Data Persistence
# ============================================
volumes:
  postgres_data:
    driver: local
  memgraph_data:
    driver: local
  qdrant_storage:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local

# ============================================
# Network Configuration
# ============================================
networks:
  rckg-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
